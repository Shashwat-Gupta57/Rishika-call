<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Spiral Scrapbook</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background-color: #d1bfae; /* Wood/Desk look for album page */
      background-image: none;
    }
    
    .album-wrapper {
      position: relative;
      max-width: 900px;
      margin: 40px auto;
      perspective: 1500px;
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .spiral-notebook {
      position: relative;
      width: 100%;
      height: 600px;
      display: flex;
      background: transparent;
      box-shadow: 10px 20px 30px rgba(0,0,0,0.3);
      border-radius: 10px;
      transform-style: preserve-3d;
    }

    .book-left-page, .book-right-page {
      width: 50%;
      height: 100%;
      background-color: #fffaf0;
      position: relative;
      box-sizing: border-box;
      background-image: 
        radial-gradient(#e8e4db 2px, transparent 2px),
        linear-gradient(90deg, transparent 5%, #ffb7b2 5%, #ffb7b2 6%, transparent 6%);
      background-size: 20px 20px, 100% 100%;
    }

    .book-left-page {
      border-radius: 10px 0 0 10px;
      border-right: 2px solid #ddd;
    }
    
    .book-right-page {
      border-radius: 0 10px 10px 0;
      border-left: 2px solid #ddd;
    }

    /* The Spiral Binding */
    .spiral-binding {
      position: absolute;
      top: 2%;
      bottom: 2%;
      left: 50%;
      width: 40px;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      pointer-events: none;
    }
    
    .spiral-ring {
      width: 40px;
      height: 10px;
      background: linear-gradient(0deg, #555, #999, #555);
      border-radius: 5px;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
    }

    /* Scrapbook Content Areas */
    .page-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 30px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-in-out;
    }

    .album-nav {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      align-items: center;
      font-family: var(--font-main);
      font-size: 2rem;
      color: white;
      text-shadow: 1px 1px 2px #000;
      z-index: 20;
    }

    /* Small polaroids for Album */
    .album-photo {
      width: 40%;
      margin: 10px;
      transform: rotate(calc(-5deg + 10deg * var(--rand-tilt)));
    }
    .album-photo .tape { top: -5px; width: 50px; height: 15px;}
    .album-photo .caption { font-size: 1.2rem; }
    
    .page-title {
      font-family: var(--font-main);
      font-size: 3rem;
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      color: #777;
    }

    /* Page Turn Animation classes */
    .flip-out-left { animation: flipOutLeft 0.6s forwards; }
    .flip-in-right { animation: flipInRight 0.6s forwards; }
    
    @keyframes flipOutLeft {
      0% { transform: perspective(1500px) rotateY(0deg); transform-origin: left center;}
      100% { transform: perspective(1500px) rotateY(-90deg); transform-origin: left center; opacity: 0; }
    }
    
    @keyframes flipInRight {
      0% { transform: perspective(1500px) rotateY(90deg); transform-origin: right center; opacity: 0; }
      100% { transform: perspective(1500px) rotateY(0deg); transform-origin: right center; opacity: 1; }
    }

    @media (max-width: 800px) {
      .spiral-notebook { flex-direction: column; height: auto; }
      .book-left-page, .book-right-page { width: 100%; height: 500px; border-radius: 10px;}
      .spiral-binding { width: 100%; height: 40px; top: 50%; left: 0; transform: translateY(-50%); flex-direction: row;}
      .spiral-ring { width: 10px; height: 40px; }
    }
  </style>
</head>
<body>
  
  <div class="album-wrapper">
    <div style="font-family: var(--font-main); font-size: 3.5rem; color: white; margin-bottom: 20px; text-shadow: 2px 2px 5px #000;">
      Our Scrapbook (18+ photos inside)
    </div>

    <!-- The Spiral Album -->
    <div class="spiral-notebook" id="notebook">
      
      <!-- Left Page -->
      <div class="book-left-page">
        <div class="page-content" id="page-left">
          <!-- JS fills this -->
        </div>
      </div>
      
      <!-- Center Bindings -->
      <div class="spiral-binding">
        <!-- Generates 12 rings -->
        <div class="spiral-ring"></div><div class="spiral-ring"></div>
        <div class="spiral-ring"></div><div class="spiral-ring"></div>
        <div class="spiral-ring"></div><div class="spiral-ring"></div>
        <div class="spiral-ring"></div><div class="spiral-ring"></div>
        <div class="spiral-ring"></div><div class="spiral-ring"></div>
        <div class="spiral-ring"></div><div class="spiral-ring"></div>
      </div>

      <!-- Right Page -->
      <div class="book-right-page">
        <div class="page-content" id="page-right">
          <!-- JS fills this -->
        </div>
      </div>
    
    </div>

    <!-- Navigation -->
    <div class="album-nav">
      <button class="btn" id="btn-prev">⬅️ Previous</button>
      <span id="page-indicator">Spread 1 / x</span>
      <button class="btn" id="btn-next">Next ➡️</button>
    </div>

    <div style="margin-top: 30px;">
      <a href="memories.html" class="btn" style="background-color: var(--highlight-blue);">⬅️ Back</a>
      <a href="evidence.html" class="btn" style="background-color: var(--highlight-yellow);">See The Evidence ➡️</a>
    </div>

  </div>

  <script src="js/main.js"></script>
  <script src="js/album.js"></script>
</body>
</html>
