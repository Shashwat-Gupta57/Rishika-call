<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memories Page</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .gallery {
      position: relative;
      height: 600px;
      margin: 40px -20px;
      overflow: hidden;
    }
    .hero-title {
      font-size: 3rem;
      margin-top: 50px;
    }
    .huge-text {
      text-align: center;
      font-size: 3.5rem;
      margin-bottom: 30px;
      color: var(--highlight-pink);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="huge-text handwritten tilt-left-1">
      We have the best memories.<br>
      We are such close friends.<br>
      But still waiting for that call... ✨
    </div>

    <div class="gallery">
      <!-- 8 scattered photos -->
      <div class="polaroid tilt-right-1" style="position: absolute; top: 10px; left: 10%; width: 170px;">
        <div class="tape"></div>
        <img src="res/photo-4.png" alt="Memories">
      </div>

      <div class="polaroid tilt-left-2" style="position: absolute; top: 30px; left: 45%; width: 180px;">
        <div class="tape"></div>
        <img src="res/photo-5.png" alt="Memories">
      </div>

      <div class="polaroid tilt-right-2" style="position: absolute; top: 15px; right: 10%; width: 160px; z-index: 2;">
        <div class="tape"></div>
        <img src="res/photo-6.png" alt="Memories">
      </div>

      <div class="polaroid tilt-left-1" style="position: absolute; top: 220px; left: 5%; width: 190px;">
        <div class="tape"></div>
        <img src="res/photo-7.png" alt="Memories">
      </div>

      <div class="polaroid tilt-right-1" style="position: absolute; top: 250px; left: 35%; width: 170px;">
        <div class="tape"></div>
        <img src="res/photo-8.png" alt="Memories">
      </div>

      <div class="polaroid tilt-left-2" style="position: absolute; top: 200px; right: 5%; width: 200px; z-index: 3;">
        <div class="tape"></div>
        <img src="res/photo-9.png" alt="Memories">
      </div>

      <div class="polaroid tilt-right-2" style="position: absolute; bottom: 10px; left: 20%; width: 180px;">
        <div class="tape"></div>
        <img src="res/photo-10.png" alt="Memories">
      </div>

      <div class="polaroid tilt-left-1" style="position: absolute; bottom: 30px; right: 25%; width: 160px;">
        <div class="tape"></div>
        <img src="res/photo-11.png" alt="Memories">
      </div>
    </div>

    <div style="text-align: center; margin-top: 20px;">
      <a href="story.html" class="btn" style="background-color: var(--highlight-blue);">⬅️ Timeline</a>
      <a href="album.html" class="btn" style="background-color: #ffdac1;">Open the BIG Album ➡️</a>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
